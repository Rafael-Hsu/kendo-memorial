<meta name="description" content="12/5(六) 台中劍道館。第5屆游銘漢老師紀念練習大會報名與老師相片影片徵集。">
<meta property="og:title" content="第5屆游銘漢老師紀念練習大會">

<style>
  :root {
    --ink: #1d1413;
    --paper: #f3eee6;
    --gold: #9a7a36;
    --gold-hover: #b08f43;
    --wine: #2e0f10;
    --radius: 0px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--wine);
    color: var(--paper);
    font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    position: relative;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: 1fr auto;
    overflow: hidden;
    isolation: isolate;
  }
  .stage > img {
    position: absolute; inset: 0; z-index: -2;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 42% 30%;
    transform: scale(1.04);
    animation: settle 1.8s cubic-bezier(.16,1,.3,1) forwards;
  }
  /* 底部與左側壓暗，讓文字可讀，老師臉部保持乾淨 */
  .stage::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background:
      linear-gradient(to top, rgb(29 20 19 / .96) 0%, rgb(29 20 19 / .78) 34%, rgb(29 20 19 / 0) 66%),
      linear-gradient(to bottom, rgb(46 15 16 / .55), rgb(46 15 16 / 0) 22%);
  }

  .content {
    grid-row: 2;
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 24px 56px;
  }

  h1 {
    font-weight: 700;
    font-size: clamp(2rem, 6.4vw, 4.4rem);
    line-height: 1.18;
    letter-spacing: .08em;
    text-wrap: balance;
  }
  h1 .no { color: #d9b95c; }

  .band {
    display: inline-block;
    margin-top: 22px;
    padding: 12px 22px;
    background: rgb(29 20 19 / .62);
    border-left: 3px solid var(--gold);
    font-size: clamp(1.05rem, 2.6vw, 1.5rem);
    letter-spacing: .26em;
    font-weight: 600;
  }

  .actions {
    margin-top: 32px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    max-width: 640px;
  }
  .btn {
    display: flex; align-items: center; justify-content: center;
    min-height: 58px;
    padding: 0 28px;
    font: inherit; font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: .18em;
    text-decoration: none;
    border-radius: var(--radius);
    white-space: nowrap;
    transition: transform .25s cubic-bezier(.16,1,.3,1), background-color .25s, border-color .25s;
  }
  .btn:active { transform: translateY(1px) scale(.99); }
  .btn.primary { background: var(--gold); color: #fff; border: 1px solid var(--gold); }
  .btn.primary:hover { background: var(--gold-hover); border-color: var(--gold-hover); }
  .btn.ghost { background: rgb(29 20 19 / .5); color: var(--paper); border: 1px solid rgb(243 238 230 / .55); }
  .btn.ghost:hover { border-color: var(--paper); background: rgb(29 20 19 / .7); }
  .btn:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }

  .reveal { opacity: 0; transform: translateY(16px); animation: rise .9s cubic-bezier(.16,1,.3,1) forwards; }
  .reveal:nth-child(2) { animation-delay: .12s; }
  .reveal:nth-child(3) { animation-delay: .24s; }

  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes settle { to { transform: scale(1); } }

  @media (min-width: 720px) {
    .content { padding: 0 48px 72px; }
    .actions { grid-template-columns: 1fr 1fr; }
    .stage > img { object-position: 50% 28%; }
  }
  @media (max-width: 719px) {
    .stage { background: var(--ink); }
    .stage > img { height: 66dvh; object-position: 44% 40%; }
    .stage::before {
      background: linear-gradient(to bottom, rgb(29 20 19 / 0) 0, rgb(29 20 19 / 0) 40dvh, var(--ink) 66dvh);
    }
    .band { letter-spacing: .18em; }
    .btn { letter-spacing: .1em; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal, .stage > img { animation: none; opacity: 1; transform: none; }
    .btn { transition: none; }
  }
</style>
